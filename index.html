<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f7">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Девять вариантов анимации для первого экрана студии Веб Анатомия.">
  <title>Движение как часть формы · Веб Анатомия</title>
  <link rel="icon" href="./assets/logo-sign.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="signature"><img src="./assets/logo-sign.svg" alt="" width="34" height="24"><span>ВЕБ АНАТОМИЯ</span></div>
      <a class="project-tag preview-link" href="./mobile/"><span class="tag-dot" aria-hidden="true"></span> 18 ПЕРВЫХ ЭКРАНОВ <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <div class="intro">
        <h1>Движение<br>как часть формы<span class="period">.</span></h1>
        <p>Девять вариантов первого экрана.<br> Выбери сцену, чтобы посмотреть её в движении.</p>
      </div>
      <section class="laboratory" aria-label="Варианты анимации">
        <div class="scene-bar">
          <div class="scene-heading">
            <span id="scene-number" class="scene-number" aria-hidden="true">01</span>
            <h2 id="scene-title">Знак из точек</h2>
          </div>
          <div class="transport">
            <button id="pause" type="button" aria-label="Пауза" title="Пауза" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path id="pause-shape" d="M9 5v14M15 5v14"/></svg>
              <span id="pause-label">Пауза</span>
            </button>
            <button id="replay" type="button" title="Запустить анимацию заново" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg>
              <span>Повторить</span>
            </button>
          </div>
        </div>
        <div id="scene-panel" class="viewport" role="tabpanel" aria-labelledby="tab-01" tabindex="0">
          <div class="stage-decoration" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div id="stage" class="stage"></div>
          <div id="scene-message" class="stage-message" role="status">Загружаем сцену</div>
          <div class="stage-index" aria-hidden="true"><span id="stage-index">01</span> <span>/ 09</span></div>
        </div>
        <div class="scene-notes"><p id="scene-description">Три облака собираются в монограмму. Точки остаются видимыми и после сборки.</p><p id="scene-hint"><span class="hint-dot" aria-hidden="true"></span><span>Двигай курсором</span></p></div>
        <nav id="scenes" class="scenes" role="tablist" aria-label="Выбери анимацию"></nav>
      </section>
      <noscript>Включи JavaScript, чтобы посмотреть анимации.</noscript>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
